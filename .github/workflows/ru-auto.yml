name: RU auto and MRS rulesets

# Ежедневная пересборка rulesets/direct/ru-auto.* из geosite.dat runetfreedom
# (релиз выходит около 10:00 UTC), компиляция ru-auto.mrs и обновление nemu-x-wl.mrs
# из upstream clV2_provider.yaml.
on:
  schedule:
    - cron: "40 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ru-auto
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install pinned mihomo binary
        run: |
          MIHOMO_VER="v1.19.33"
          MIHOMO_GZ="mihomo-linux-amd64-${MIHOMO_VER}.gz"
          MIHOMO_SHA="132f6f3edf9a65e62f04853aed3358472e0b2b7666daa8419edfa2ddf5bb6323"
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VER}/${MIHOMO_GZ}" -o "${MIHOMO_GZ}"
          echo "${MIHOMO_SHA}  ${MIHOMO_GZ}" | sha256sum -c -
          gunzip -c "${MIHOMO_GZ}" > mihomo
          chmod +x mihomo
          rm -f "${MIHOMO_GZ}"
      - name: Build ru-auto and .mrs rulesets
        run: |
          uv run scripts/build_ru_auto.py
          uv run scripts/build_mrs.py --mihomo ./mihomo --only-ru-auto --with-nemu
      - name: Commit if changed
        run: |
          changed_files=()
          # строка с датой сборки меняется каждый день; коммит только если поменялся сам список
          if git diff -U0 -- rulesets/direct/ru-auto.min.yaml | grep -qE '^[-+]  - '; then
            changed_files+=(rulesets/direct/ru-auto.yaml rulesets/direct/ru-auto.min.yaml rulesets/direct/ru-auto.mrs)
          else
            git checkout -- rulesets/direct/ru-auto.yaml rulesets/direct/ru-auto.min.yaml rulesets/direct/ru-auto.mrs
          fi
          if ! git diff --quiet -- rulesets/proxy/nemu-x-wl.mrs; then
            changed_files+=(rulesets/proxy/nemu-x-wl.mrs)
          fi
          if [ ${#changed_files[@]} -eq 0 ]; then
            echo "без изменений"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${changed_files[@]}"
          git commit -m "rulesets: auto-update $(date -u +%Y-%m-%d)"
          git push
