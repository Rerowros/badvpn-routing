    expected-status: 204
    proxies:
      {% for p in conf.proxies %}{% if ("🇹🇷" in p.name or "Turkey" in p.name or "Турция" in p.name) and "БЕЛЫЕ" not in p.name and "LTE" not in p.name and "->" not in p.name and "BadVPN доступ" not in p.name %}- "{{ p.name }}"
      {% endif %}{% endfor %}- "⚡ Авто (рекомендуется)"
  {% endif %}

  - name: "🛡 Режим белых списков (БПЛА)"
    type: fallback
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    timeout: 5000
    max-failed-times: 2
    expected-status: 204
    lazy: false
    proxies:
      {% if groups.whitelist %}{% for p in conf.proxies %}{% if "БЕЛЫЕ" in p.name or "->" in p.name or "LTE" in p.name or "BadVPN доступ" in p.name %}- "{{ p.name }}"
      {% endif %}{% endfor %}{% elif groups.auto %}{% for p in conf.proxies %}{% if "БЕЛЫЕ" not in p.name and "LTE" not in p.name and "BadVPN доступ" not in p.name and "SPB" not in p.name and "❌" not in p.name and "💳" not in p.name and "@BPN" not in p.name and "->" not in p.name and "🇳🇱" not in p.name and "🇷🇴" not in p.name and "🇫🇮" not in p.name and "Finland" not in p.name and "Финляндия" not in p.name and "XHTTP" not in p.name %}- "{{ p.name }}"
      {% endif %}{% endfor %}{% else %}- DIRECT
      {% endif %}

