      {% endif %}{% if groups.se %}- "🇸🇪 Швеция (все серверы)"
      {% endif %}{% if groups.ch %}- "🇨🇭 Швейцария (все серверы)"
      {% endif %}{% if groups.nl %}- "🇳🇱 Нидерланды (все серверы)"
      {% endif %}{% if groups.de %}- "🇩🇪 Германия (все серверы)"
      {% endif %}{% if groups.hu %}- "🇭🇺 Венгрия (все серверы)"
      {% endif %}{% if groups.tr %}- "🇹🇷 Турция (все серверы)"
