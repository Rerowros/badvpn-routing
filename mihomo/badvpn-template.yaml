      {% endif %}{% endfor %}{% for p in conf.proxies %}{% if ("🇹🇷" in p.name or "Turkey" in p.name or "Турция" in p.name) and "БЕЛЫЕ" not in p.name and "LTE" not in p.name and "->" not in p.name and "BadVPN доступ" not in p.name and "XHTTP" not in p.name %}- "{{ p.name }}"
      {% endif %}{% endfor %}{% else %}- "Выбор сервера"
      {% endif %}

  - name: "🤖 AI Авто"
    type: fallback
