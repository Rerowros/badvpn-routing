rules:
  - RULE-SET,private-ips,DIRECT,no-resolve
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,private,DIRECT
  - RULE-SET,private-domains,DIRECT

  # IPv6 disabled in this template; keep accidental IPv6/QUIC from leaking past rules.
  - IP-CIDR,::/0,REJECT-DROP,no-resolve
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT-DROP

  # Strong direct decisions before proxy exceptions.
  - RULE-SET,PROCESS-DIRECT-PC,DIRECT
  - RULE-SET,PROCESS-DIRECT-APK,DIRECT
  - RULE-SET,PROCESS-DIRECT-APK-WILDCARD,DIRECT
  - RULE-SET,DOMAIN-DIRECT-KEYWORD,DIRECT
  - RULE-SET,BadVPN-Torrents,DIRECT
  - RULE-SET,torrent-clients,DIRECT
  - RULE-SET,torrent-domains,DIRECT

  # Blocking.
  - GEOSITE,category-ads-all,REJECT
  - RULE-SET,category-ads,REJECT
  - RULE-SET,win-spy,REJECT

  # Dedicated routed products.
  - RULE-SET,BadVPN-Youtube-Discord,📺 YouTube и Discord
  - RULE-SET,youtube,📺 YouTube и Discord
  - GEOSITE,youtube,📺 YouTube и Discord
  - GEOSITE,discord,📺 YouTube и Discord

  - RULE-SET,BadVPN-Gemini,✨ Gemini
  - RULE-SET,BadVPN-AI,🤖 AI

  - RULE-SET,Nemu-X-TG,Выбор сервера
  - RULE-SET,telegram,Выбор сервера
  - GEOSITE,telegram,Выбор сервера
  - RULE-SET,BadVPN-Telegram-Extra,Выбор сервера,no-resolve

  - RULE-SET,github,Выбор сервера
  - GEOSITE,github,Выбор сервера
  - RULE-SET,BadVPN-GitHub-Extra,Выбор сервера
  - RULE-SET,google-play,Выбор сервера

  # Games default to DIRECT through the separate group, but can be switched to VPN in the client UI.
  - RULE-SET,BadVPN-Games-Core,🎮 Игры
  - RULE-SET,games,🎮 Игры
  - RULE-SET,epicgames,🎮 Игры
  - RULE-SET,origin,🎮 Игры
  - RULE-SET,riot,🎮 Игры
  - RULE-SET,escapefromtarkov,🎮 Игры
  - RULE-SET,steam,🎮 Игры
  - RULE-SET,faceit,🎮 Игры

  - RULE-SET,Nemu-X-WL,Выбор сервера
  - RULE-SET,Nemu-X-APPS,Выбор сервера

  # Broad RU direct goes after proxy exceptions so blocked non-critical domains can still be proxied.
  - RULE-SET,BadVPN-RU-Core,DIRECT
  - RULE-SET,DOMAIN-DIRECT-SUFFIX,DIRECT
  - RULE-SET,ru-apps,DIRECT
  - RULE-SET,microsoft,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,category-ru,DIRECT
  - RULE-SET,hydra-whitelist,DIRECT
  - RULE-SET,direct-ips,DIRECT
  - GEOIP,ru,DIRECT,no-resolve

  - MATCH,Выбор сервера
