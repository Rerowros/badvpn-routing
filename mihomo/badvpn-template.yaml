# BadVPN Mihomo template.
# Secrets are intentionally not defined here. Keep authentication in the panel/base config.
{% set badvpn_ruleset_base_url = conf.badvpn_ruleset_base_url | default("https://raw.githubusercontent.com/Rerowros/badvpn-routing/refs/heads/main/rulesets") %}

mode: rule
ipv6: false
log-level: info
allow-lan: false
unified-delay: true
tcp-concurrent: true
find-process-mode: always

geodata-mode: true
geo-auto-update: true
geo-update-interval: 72
geox-url:
  geoip: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://mirror.ghproxy.com/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"

tun:
  enable: true
  stack: mixed
  dns-hijack: [any:53]
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  route-exclude-address:
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127

dns:
  enable: true
  listen: :1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  use-hosts: true
  use-system-hosts: true
  prefer-h3: false
  fake-ip-filter:
    - "rule-set:private-domains"
    - "rule-set:category-ru"
    - "*.lan"
    - "*.local"
    - "+.ntp.org"
    - "+.pool.ntp.org"
    - "time.windows.com"
    - "time.apple.com"
    - "time.nist.gov"
    - "connectivitycheck.gstatic.com"
    - "detectportal.firefox.com"
    - "msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.ru"
    - "+.su"
    - "+.xn--p1ai"
    - "+.badvpn.pro"
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
    - 77.88.8.8
  proxy-server-nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  direct-nameserver:
    - https://common.dot.dns.yandex.net/dns-query
    - https://1.1.1.1/dns-query
  nameserver-policy:
    '+.badvpn.pro': ['https://1.1.1.1/dns-query']
    '+.ru': ['https://common.dot.dns.yandex.net/dns-query', 'https://1.1.1.1/dns-query']
    '+.su': ['https://common.dot.dns.yandex.net/dns-query', 'https://1.1.1.1/dns-query']
    '+.xn--p1ai': ['https://common.dot.dns.yandex.net/dns-query', 'https://1.1.1.1/dns-query']
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

sniffer:
  enable: true
  override-destination: true
  parse-pure-ip: true
  force-domain:
    - "+"
  skip-domain:
    - "+.push.apple.com"
    - "+.apple.com"
  skip-dst-address:
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 198.18.0.0/15
    - 169.254.0.0/16
    - 192.168.0.0/16
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 198.51.100.0/24
    - 203.0.113.0/24
    - fc00::/7
    - ff00::/8
    - fe80::/10
    - ::/127
  sniff:
    HTTP: { ports: [80, 8080-8880] }
    TLS: { ports: [443, 8443] }
    QUIC: { ports: [443, 8443] }

profile:
  store-selected: true
  store-fake-ip: true

{{ conf | except("proxy-groups", "port", "mode", "rules", "ipv6", "log-level", "allow-lan", "unified-delay", "tcp-concurrent", "find-process-mode", "geodata-mode", "geo-auto-update", "geo-update-interval", "geox-url", "tun", "dns", "sniffer", "profile", "mixed-port", "badvpn_ruleset_base_url") | yaml }}

proxy-groups:

  {% set groups = namespace(us=false, se=false, ch=false, nl=false, de=false, hu=false, tr=false, ai=false, gemini=false, auto=false, whitelist=false, spb=false) %}
  {% for p in conf.proxies %}
  {% if "🇺🇸" in p.name or "USA" in p.name or "США" in p.name %}{% set groups.us = true %}{% endif %}
  {% if "🇸🇪" in p.name or "Sweden" in p.name or "Швеция" in p.name %}{% set groups.se = true %}{% endif %}
  {% if "🇨🇭" in p.name or "Switzerland" in p.name or "Swiss" in p.name or "Швейцария" in p.name or "Bern" in p.name or "Берн" in p.name %}{% set groups.ch = true %}{% endif %}
  {% if "🇳🇱" in p.name or "Netherlands" in p.name or "Нидерланды" in p.name or "NL" in p.name %}{% set groups.nl = true %}{% endif %}
  {% if "🇩🇪" in p.name or "Germany" in p.name or "Германия" in p.name %}{% set groups.de = true %}{% endif %}
  {% if "🇭🇺" in p.name or "Hungary" in p.name or "Венгрия" in p.name %}{% set groups.hu = true %}{% endif %}
  {% if "🇹🇷" in p.name or "Turkey" in p.name or "Турция" in p.name %}{% set groups.tr = true %}{% endif %}
  {% if "SPB" in p.name %}{% set groups.spb = true %}{% endif %}
  {% if "БЕЛЫЕ" in p.name or "->" in p.name or "LTE" in p.name or "BadVPN доступ" in p.name %}{% set groups.whitelist = true %}{% endif %}
  {% if (("🇳🇱" in p.name or "Netherlands" in p.name or "Нидерланды" in p.name or "NL" in p.name or "🇸🇪" in p.name or "Sweden" in p.name or "Швеция" in p.name or "🇺🇸" in p.name or "USA" in p.name or "США" in p.name or "🇨🇭" in p.name or "Switzerland" in p.name or "Swiss" in p.name or "Швейцария" in p.name or "Bern" in p.name or "Берн" in p.name or "🇹🇷" in p.name or "Turkey" in p.name or "Турция" in p.name) and "БЕЛЫЕ" not in p.name and "LTE" not in p.name and "->" not in p.name and "BadVPN доступ" not in p.name and "XHTTP" not in p.name) %}{% set groups.ai = true %}{% endif %}
  {% if (("🇸🇪" in p.name or "Sweden" in p.name or "Швеция" in p.name or "🇺🇸" in p.name or "USA" in p.name or "США" in p.name or "🇨🇭" in p.name or "Switzerland" in p.name or "Swiss" in p.name or "Швейцария" in p.name or "Bern" in p.name or "Берн" in p.name) and "БЕЛЫЕ" not in p.name and "LTE" not in p.name and "->" not in p.name and "BadVPN доступ" not in p.name and "XHTTP" not in p.name) %}{% set groups.gemini = true %}{% endif %}
  {% if "БЕЛЫЕ" not in p.name and "LTE" not in p.name and "BadVPN доступ" not in p.name and "SPB" not in p.name and "❌" not in p.name and "💳" not in p.name and "@BPN" not in p.name and "->" not in p.name and "🇳🇱" not in p.name and "🇷🇴" not in p.name and "🇫🇮" not in p.name and "Finland" not in p.name and "Финляндия" not in p.name and "XHTTP" not in p.name %}{% set groups.auto = true %}{% endif %}
  {% endfor %}

  - name: "Выбор сервера"
    type: select
    proxies:
      - "⚡ Авто (рекомендуется)"
      - "🛡 Режим белых списков (БПЛА)"
