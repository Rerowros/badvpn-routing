      {% endif %}{% endfor %}{% for p in conf.proxies %}{% if ("🇳🇱" in p.name or "Netherlands" in p.name or "Нидерланды" in p.name or "NL" in p.name) and "БЕЛЫЕ" not in p.name and "LTE" not in p.name and "->" not in p.name and "BadVPN доступ" not in p.name and "XHTTP" not in p.name %}- "{{ p.name }}"
      {% endif %}{% endfor %}{% for p in conf.proxies %}{% if ("🇸🇪" in p.name or "Sweden" in p.name or "Швеция" in p.name) and "БЕЛЫЕ" not in p.name and "LTE" not in p.name and "->" not in p.name and "BadVPN доступ" not in p.name and "XHTTP" not in p.name %}- "{{ p.name }}"
